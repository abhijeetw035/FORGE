name: FORGE Code Analysis

# Comments on pull requests with FORGE's risk forecast for the files they change.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   FORGE_API_URL   base URL of a FORGE instance REACHABLE FROM GITHUB'S RUNNERS
#                   (localhost does not work: deploy FORGE or use a self-hosted runner)
#   FORGE_EMAIL     login of a dedicated CI user that OWNS the repository in FORGE
#   FORGE_PASSWORD
#   FORGE_REPO_ID   numeric id of the repository in FORGE
#
# The job fails (red check) if FORGE is unreachable, the login is rejected, or the
# secrets are missing. It never silently passes.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: forge-analysis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip PRs from forks (GitHub does not give them secrets)
        id: guard
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::notice title=FORGE analysis skipped::PRs from forks cannot access the FORGE secrets, so no analysis was run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Plain git instead of a third-party action; file names are never
      # interpolated into the script (they are attacker-controlled in a PR).
      - name: List changed source files
        if: steps.guard.outputs.run == 'true'
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" \
            -- '*.py' '*.js' '*.jsx' '*.ts' '*.tsx' '*.java' '*.go' > "$RUNNER_TEMP/changed.txt"
          echo "Changed source files: $(wc -l < "$RUNNER_TEMP/changed.txt")"
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Analyze with FORGE
        if: steps.guard.outputs.run == 'true' && steps.changed.outputs.any == 'true'
        env:
          FORGE_API_URL: ${{ secrets.FORGE_API_URL }}
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_PASSWORD: ${{ secrets.FORGE_PASSWORD }}
          FORGE_REPO_ID: ${{ secrets.FORGE_REPO_ID }}
          CHANGED_FILES: ${{ runner.temp }}/changed.txt
          COMMENT_FILE: ${{ runner.temp }}/forge-comment.md
        run: python3 .github/scripts/forge_pr_check.py

      - name: Post or update the PR comment
        if: steps.guard.outputs.run == 'true' && steps.changed.outputs.any == 'true'
        uses: actions/github-script@v7
        env:
          COMMENT_FILE: ${{ runner.temp }}/forge-comment.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.COMMENT_FILE, 'utf8');
            const marker = '<!-- forge-analysis -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            // Update our previous comment instead of adding a new one on every push.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
